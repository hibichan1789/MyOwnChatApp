<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>自作ChatGPT</title>
    <link rel="stylesheet" href="../../style.css">
    <script type="module" src="./chat.ts" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="h-screen flex overflow-hidden">

    <div id="sidebar" class="bg-gray-900 text-white w-64 transition-all duration-300 overflow-y-auto flex flex-col">
        <button id="toggleSidebar" class="p-3 w-full text-left hover:bg-gray-700 cursor-pointer">
            ═
        </button>
        <button id="newChatBtn" class="p-3 w-full text-left bg-gray-600 hover:bg-gray-500 border-b border-gray-700 cursor-pointer">
            新規会話
        </button>
        <div id="conversationList" class="mt-2 flex-1 overflow-y-auto"></div>

        <button id="logoutBtn" class="p-3 w-full text-left bg-red-600 hover:bg-red-700 border-t border-gray-700 mt-auto cursor-pointer">
            ログアウト
        </button>
    </div>

    <div class="flex flex-col flex-1 bg-gray-100">
        <div id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <form id="chatForm" class="border-t border-gray-300 p-3 bg-white flex gap-2">
            <input type="text" id="chatInput"
                class="flex-1 border border-gray-300  focus:outline-none focus:ring-2 focus:ring-indigo-600 p-2 rounded"
                placeholder="メッセージを入力">
            <button type="submit" id="submitBtn"
                class="px-4 py-2 bg-blue-600 text-white rounded  hover:bg-blue-700 transition cursor-pointer">送信</button>
        </form>
    </div>
</body>

</html>
